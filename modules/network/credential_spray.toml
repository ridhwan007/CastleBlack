[module]
id              = "CRED-SPRAY-001"
name            = "Credential Password Spray"
version         = "1.0.0"
mitre_technique = "T1110.003"
cvss_base       = 6.5
destructive     = false
requires_auth   = false
requires_domain = true
sandboxable     = true
phase           = "CREDENTIAL_ACCESS"
tags            = ["credential_access", "password_spray", "lockout_safe"]

[parameters]
dc_ip        = { type = "string",      required = true }
domain       = { type = "string",      required = true }
userlist     = { type = "list",        required = true }
passwords    = { type = "list",        required = true }
engagement_id = { type = "string",    required = false }

[safety]
max_requests_per_second   = 0.03   # ~2 per minute
causes_lockout            = false  # Enforced by CredentialRateLimiter
modifies_target           = false
reads_lockout_policy_first = true

[poe]
artefact_type = "credential"
validates_via = "ldap_bind_success"
